<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="acup.">
  <!-- Isotipo acup. — cuadrado marino, la 'a' en blanco y el punto de marca en coral -->
  <rect width="64" height="64" rx="14" fill="#30408E"/>
  <!-- ojo de la 'a' -->
  <circle cx="24.5" cy="38" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <!-- asta derecha, alineada con el borde del ojo -->
  <rect x="31" y="25.5" width="6" height="25" rx="3" fill="#FFFFFF"/>
  <!-- el punto -->
  <circle cx="47.5" cy="46" r="4.5" fill="#F85A7A"/>
</svg>
